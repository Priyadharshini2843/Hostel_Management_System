services:
  - type: web
    name: hostel-management-system
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://hostel-management-system-1-o1zq.onrender.com
      - key: CLIENT_URL
        value: https://hostel-management-system-1-o1zq.onrender.com
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
